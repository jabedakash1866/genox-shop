<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GENOX SHOP</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--p:#1f6feb;--pl:#e7f0ff;--tx:#18212f;--mu:#667085;--bd:#e4e9f2;--ok:#16a34a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,"Noto Sans Bengali",Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.45;padding:calc(62px + env(safe-area-inset-top)) 0 calc(80px + env(safe-area-inset-bottom))}
button,input,select{font:inherit}
a{color:inherit;text-decoration:none}
.top{position:fixed;top:0;left:0;right:0;z-index:20;background:#fff;border-bottom:1px solid var(--bd);padding:env(safe-area-inset-top) 14px 0;height:calc(56px + env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-weight:800}
.logo{width:34px;height:34px;border-radius:10px;background:var(--p);color:#fff;display:grid;place-items:center;font-weight:800;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.pill{background:var(--pl);color:var(--p);border:1px solid #cfe0ff;border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px}
.wrap{max-width:560px;margin:0 auto;padding:14px}
.sec{font-size:16px;margin:20px 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;box-shadow:0 2px 10px rgba(20,40,80,.06);margin-bottom:12px}
.banner{border-radius:18px;overflow:hidden;background:linear-gradient(135deg,#1f6feb,#5b9bff);color:#fff;min-height:150px;display:grid;place-items:center;text-align:center;padding:18px}
.banner img{width:100%;display:block}
.banner h2{font-size:24px}
.svc{display:flex;flex-wrap:wrap;justify-content:center;gap:18px 10px}
.svc a{width:46%;text-align:center;font-weight:700;font-size:14px}
.ic{width:72px;height:72px;border-radius:50%;background:var(--pl);border:1px solid #cfe0ff;display:grid;place-items:center;font-size:30px;margin:0 auto 6px;overflow:hidden}
.ic.sm{width:44px;height:44px;font-size:22px;margin:0 0 6px;flex:none}
.ic img{width:100%;height:100%;object-fit:cover}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tools .card{margin:0;text-align:center;font-weight:700;font-size:14px}
.tools .ic{width:48px;height:48px;font-size:24px}
.head{display:flex;gap:12px;align-items:center}
.head .ic{margin:0}
.back{display:inline-block;color:var(--p);font-weight:700;margin-bottom:10px}
.notice{background:#fff8e6;border:1px solid #f5dfa0;border-radius:14px;padding:12px;white-space:pre-wrap;margin-bottom:12px;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pkg{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px;cursor:pointer;box-shadow:0 2px 8px rgba(20,40,80,.05)}
.pkg b{font-size:16px}.pkg span{color:var(--mu);font-size:13px}.pkg em{font-style:normal;color:var(--p);font-weight:800;font-size:17px;margin-top:4px}
.btn{display:block;width:100%;background:var(--p);color:#fff;border:0;border-radius:12px;padding:13px;font-weight:700;margin-top:12px;cursor:pointer}
.btn.alt{background:#fff;color:var(--p);border:1px solid var(--p)}
.btn:disabled{opacity:.6}
label{display:block;font-weight:600;font-size:13px;margin:12px 0 4px;color:var(--mu)}
input,select{width:100%;border:1px solid var(--bd);border-radius:12px;padding:12px;background:#fff;color:var(--tx)}
.mu{color:var(--mu)}
.warn{background:#fdecec;border:1px solid #f5c2c2;color:#a12626;border-radius:12px;padding:10px;margin-top:10px;font-size:14px}
.paybox{background:var(--pl);border-radius:12px;padding:10px;margin-top:12px;font-size:14px}
.sum{border:1px solid var(--bd);border-radius:12px;margin:10px 0}
.sum div{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border-bottom:1px solid var(--bd);font-size:14px}
.sum div:last-child{border:0}.sum b{text-align:right;word-break:break-all}
.steps{display:flex;gap:8px;margin-bottom:10px}
.steps i{flex:1;text-align:center;font-style:normal;font-size:12px;padding:5px 0;border-radius:8px;background:#eef1f6;color:var(--mu);font-weight:700}
.steps i.on{background:var(--p);color:#fff}
.pk{margin-bottom:6px}
.filters{display:flex;gap:8px;margin-bottom:12px}
.filters button{flex:1;padding:9px 4px;border:1px solid var(--bd);background:#fff;border-radius:999px;font-size:13px;font-weight:700;color:var(--mu)}
.filters button.on{background:var(--p);color:#fff;border-color:var(--p)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.st{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:#eef1f6}
.st.pending{background:#fff3d6;color:#9a6700}.st.completed{background:#dcfce7;color:#166534}.st.cancelled,.st.rejected{background:#fde2e2;color:#991b1b}
details{margin-top:8px}summary{color:var(--p);font-weight:700;cursor:pointer}
.soc{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:24px}
.soc a{background:#fff;border:1px solid var(--bd);border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px}
.foot{text-align:center;color:var(--mu);font-size:12px;margin-top:12px}
.av{width:84px;height:84px;border-radius:50%;background:var(--pl);display:grid;place-items:center;font-size:36px;margin:0 auto 10px;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.center{text-align:center}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:1px solid var(--bd);display:flex;padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
.nav a{flex:1;text-align:center;color:var(--mu);font-size:12px;font-weight:700;padding:4px 0}
.nav a.on{color:var(--p)}
.nav svg{display:block;margin:0 auto 2px;width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#sheet{display:none;position:fixed;inset:0;z-index:50}
#sheet .bd{position:absolute;inset:0;background:rgba(10,20,40,.45)}
#sheet .box{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:#fff;border-radius:20px 20px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
#sheet .x{position:absolute;right:12px;top:10px;border:0;background:#eef1f6;border-radius:50%;width:32px;height:32px}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#18212f;color:#fff;padding:10px 16px;border-radius:12px;z-index:60;display:none;max-width:90%;font-size:14px}
pre{white-space:pre-wrap;word-break:break-word;background:#f5f7fb;border-radius:12px;padding:12px;font-family:inherit}
</style>
</head>
<body>
<div class="top"><div class="brand"><div class="logo" id="logo">G</div><span id="bn">GENOX SHOP</span></div><div class="pill" id="wal">৳ 0</div></div>
<div class="wrap" id="app"></div>
<div id="sheet"></div><div id="toast"></div>
<div class="nav">
<a href="#/home" data-k="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>Home</a>
<a href="#/orders" data-k="orders"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>My Orders</a>
<a href="#/account" data-k="account"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>My Account</a>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const C=window.GENOX_CONFIG;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;T'[m]}));
const taka=n=>'৳'+Number(n).toLocaleString('en-US');
const fmt=n=>Number(n).toLocaleString('en-US');
const pad=n=>String(n).padStart(2,'0');
const SVC={likes:{n:'Free Fire Likes',i:'❤️'},tcp:{n:'TCP Bot',i:'🤖'},glory:{n:'Guild Glory Bot',i:'🏆'}};
const TOOLS=[{k:'root',n:'Phone Root Service',i:'📱'},{k:'guild',n:'Guild Info Checker',i:'🛡️'},{k:'bio',n:'Player Bio Copy',i:'📋'},{k:'player',n:'Player Info',i:'👤'}];
const PAYN={nagad:'Nagad',bkash:'bKash',rocket:'Rocket'};
const SOC=[['youtube','YouTube'],['facebook','Facebook'],['tiktok','TikTok'],['telegram','Telegram'],['instagram','Instagram'],['whatsapp','WhatsApp']];
const STB={pending:'Pending',processing:'Processing',completed:'Completed',cancelled:'Cancelled',rejected:'Rejected'};
let sb=null,session=null,profile=null,S={of:'all',wiz:null};

function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2800)}
function openSheet(h){$('#sheet').innerHTML='<div class="bd" data-act="close"></div><div class="box"><button class="x" data-act="close">✕</button>'+h+'</div>';$('#sheet').style.display='block'}
function closeSheet(){$('#sheet').style.display='none';$('#sheet').innerHTML=''}
function link(k,v){v=String(v||'').trim();if(!v)return'';if(/^https?:/i.test(v))return v;if(k==='whatsapp')return 'https://wa.me/'+v.replace(/\D/g,'');if(k==='telegram')return 'https://t.me/'+v.replace('@','');return ''}
function img(src,fb){return src?'<img src="'+esc(src)+'" alt="" onerror="this.style.display=\'none\'">':fb}
function sumHtml(a){return '<div class="sum">'+a.map(r=>'<div><span>'+esc(r[0])+'</span><b>'+esc(r[1])+'</b></div>').join('')+'</div>'}
function findPkg(id){for(const c in C.likes){const p=C.likes[c].packages.find(x=>x.id===id);if(p)return{p,cat:c}}
let p=C.tcp.packages.find(x=>x.id===id);if(p)return{p,cat:''};p=C.glory.packages.find(x=>x.id===id);if(p)return{p,cat:''};return null}

async function loadProfile(){profile=null;if(sb&&session){const r=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();profile=r.data||null}}
function header(){$('#logo').innerHTML=img(C.images.logo,'G')||'G';$('#bn').textContent=C.shopName;$('#wal').textContent='৳ '+fmt(profile?profile.wallet_balance||0:0)}
function loginBtns(){return '<button class="btn" data-act="login" data-p="google">Google দিয়ে লগইন</button><button class="btn alt" data-act="login" data-p="facebook">Facebook দিয়ে লগইন</button>'}
function needLogin(){if(session)return true;sessionStorage.setItem('gx_back',location.hash||'#/home');openSheet('<h3>লগইন প্রয়োজন</h3><p class="mu" style="margin-top:6px">অর্ডার করতে আগে লগইন করুন।</p>'+loginBtns());return false}
async function login(p){if(!sb)return toast('Supabase সেটিং যোগ করা হয়নি');if(!sessionStorage.getItem('gx_back'))sessionStorage.setItem('gx_back',location.hash||'#/home');const r=await sb.auth.signInWithOAuth({provider:p,options:{redirectTo:location.origin+location.pathname}});if(r.error)toast(r.error.message)}

async function send(payload,btn){
 const old=btn.textContent;btn.disabled=true;btn.textContent='অপেক্ষা করুন...';
 try{
  const s=await sb.auth.getSession();
  const r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+s.data.session.access_token},body:JSON.stringify(payload)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok||!j.ok)throw new Error(j.error||'অর্ডার সম্পন্ন হয়নি');
  return j.order;
 }catch(e){toast(e.message||'সার্ভারে সমস্যা');btn.disabled=false;btn.textContent=old;return null}
}
async function callApi(path){const r=await fetch(path);const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok)throw new Error(j.error||'তথ্য পাওয়া যায়নি');return j.data}

function payFields(){
 const pm=Object.entries(C.payment).filter(e=>String(e[1]).trim());
 if(!pm.length)return '<div class="warn">পেমেন্ট তথ্য এখনো যোগ করা হয়নি।</div>';
 return '<div class="paybox">'+pm.map(e=>'<div><b>'+PAYN[e[0]]+'</b>: '+esc(e[1])+'</div>').join('')+'<small>টাকা পাঠিয়ে Transaction ID দিন।</small></div><label>Payment Method</label><select id="f_pay">'+pm.map(e=>'<option value="'+e[0]+'">'+PAYN[e[0]]+'</option>').join('')+'</select><label>Transaction ID</label><input id="f_txn" placeholder="Transaction ID">';
}
function contactFields(n,p){return '<label>আপনার নাম</label><input id="f_name" value="'+esc(n!=null?n:(profile&&profile.display_name)||'')+'"><label>ফোন / WhatsApp নম্বর</label><input id="f_phone" inputmode="tel" value="'+esc(p||'')+'">'}
const g=id=>(($('#'+id)||{}).value||'').trim();
function checkContact(n,p){if(n.length<2)return 'নাম লিখুন';if(!/^\+?\d{8,15}$/.test(p))return 'সঠিক ফোন নম্বর লিখুন';return ''}
const okUid=v=>/^\d{6,14}$/.test(v);

function openOrder(svc,id){
 if(!needLogin())return;
 const f=findPkg(id);if(!f)return;const p=f.p;
 const sum=svc==='likes'?[['Category',C.likes[f.cat].title],['Duration',pad(p.days)+' Days'],['Total Likes',fmt(p.total)],['Price',taka(p.price)]]:[['Package',p.bots+' BOT'],['Price',taka(p.price)]];
 openSheet('<h3>অর্ডার ফর্ম</h3>'+sumHtml(sum)+'<label>'+(svc==='likes'?'Free Fire UID':'Guild UID')+'</label><input id="f_uid" inputmode="numeric">'+contactFields()+payFields()+'<button class="btn" id="go">অর্ডার জমা দিন</button>');
 $('#go').onclick=async e=>{
  const name=g('f_name'),phone=g('f_phone'),uid=g('f_uid'),pay=g('f_pay'),txn=g('f_txn');
  const err=checkContact(name,phone)||(!okUid(uid)&&'সঠিক UID লিখুন')||(!pay&&'পেমেন্ট মেথড লাগবে')||(txn.length<6&&'Transaction ID লিখুন');
  if(err)return toast(err);
  const o=await send({service:svc,package_id:id,uid,name,phone,payment_method:pay,transaction_id:txn},e.target);
  if(o)openSheet('<div class="center"><div style="font-size:44px">✅</div><h3>অর্ডার জমা হয়েছে</h3><p class="mu">Order ID: <b>'+esc(o.order_code)+'</b></p><a class="btn" href="#/orders" data-act="close">My Orders দেখুন</a></div>');
 };
}

function notice(k){const t=String((C.notices||{})[k]||'').trim();return t?'<div class="notice">'+esc(t)+'</div>':''}
function svcHead(k){return '<a class="back" href="#/home">← হোম</a><div class="card head"><span class="ic sm">'+img(C.images[k],SVC[k].i)+'</span><h2>'+SVC[k].n+'</h2></div>'+notice(k)}

const pages={
 home(){
  let h='<div class="banner">'+(C.images.welcomeBanner?img(C.images.welcomeBanner,''):'<div><h2>স্বাগতম</h2><p>'+esc(C.shopName)+'</p></div>')+'</div>';
  h+='<h3 class="sec">Main Services</h3><div class="svc">'+Object.keys(SVC).map(k=>'<a href="#/'+k+'"><span class="ic">'+img(C.images[k],SVC[k].i)+'</span>'+SVC[k].n+'</a>').join('')+'</div>';
  h+='<h3 class="sec">Free Services</h3><div class="tools">'+TOOLS.map(t=>'<a class="card" href="#/tool/'+t.k+'"><span class="ic">'+t.i+'</span>'+t.n+'</a>').join('')+'</div>';
  if((C.faq||[]).length)h+='<h3 class="sec">FAQ</h3>'+C.faq.map(f=>'<div class="card"><details><summary>'+esc(f.q)+'</summary><p style="margin-top:8px">'+esc(f.a)+'</p></details></div>').join('');
  const so=SOC.map(s=>[s[1],link(s[0],C.social[s[0]])]).filter(s=>s[1]);
  h+='<div class="soc">'+so.map(s=>'<a href="'+esc(s[1])+'" target="_blank" rel="noopener">'+s[0]+'</a>').join('')+'</div><div class="foot">'+esc(C.footerText)+'</div>';
  $('#app').innerHTML=h;
 },
 likes(){
  let h=svcHead('likes');
  for(const c in C.likes){const gr=C.likes[c];h+='<h3 class="sec">'+esc(gr.title)+'</h3><div class="grid">'+gr.packages.map(p=>'<button class="pkg" data-act="likes" data-id="'+p.id+'"><b>'+pad(p.days)+' Days</b><span>'+fmt(p.total)+' Likes</span><em>'+taka(p.price)+'</em></button>').join('')+'</div>'}
  $('#app').innerHTML=h;
 },
 glory(){
  $('#app').innerHTML=svcHead('glory')+'<h3 class="sec">প্যাকেজ</h3><div class="grid">'+C.glory.packages.map(p=>'<button class="pkg" data-act="glory" data-id="'+p.id+'"><b>'+p.bots+' BOT</b><em>'+taka(p.price)+'</em></button>').join('')+'</div>';
 },
 tcp(){
  $('#app').innerHTML=svcHead('tcp')+'<h3 class="sec">প্যাকেজ</h3><div class="grid">'+C.tcp.packages.map(p=>'<button class="pkg" data-act="tcp" data-id="'+p.id+'"><b>'+pad(p.days)+' Days</b><em>'+taka(p.price)+'</em></button>').join('')+'</div><div id="wiz" style="margin-top:14px"></div>';
 },
 async orders(){
  if(!session){$('#app').innerHTML='<div class="card center"><h3>লগইন প্রয়োজন</h3><p class="mu">আপনার অর্ডার দেখতে লগইন করুন।</p>'+loginBtns()+'</div>';sessionStorage.setItem('gx_back','#/orders');return}
  $('#app').innerHTML='<p class="mu center">লোড হচ্ছে...</p>';
  const r=await sb.from('orders').select('*').order('created_at',{ascending:false});
  if(r.error){$('#app').innerHTML='<div class="warn">'+esc(r.error.message)+'</div>';return}
  S.orders=r.data||[];drawOrders();
 },
 account(){
  if(!session){sessionStorage.setItem('gx_back','#/account');$('#app').innerHTML='<div class="card center"><div class="av">👤</div><h3>Not Logged In</h3><p class="mu">লগইন করে অর্ডার ও প্রোফাইল দেখুন।</p>'+loginBtns()+'</div>';return}
  const m=session.user.user_metadata||{};const nm=(profile&&profile.display_name)||m.full_name||m.name||'Customer';const av=(profile&&profile.avatar_url)||m.avatar_url||C.images.profile;
  const ct=[['whatsapp','WhatsApp'],['telegram','Telegram']].map(s=>[s[1],link(s[0],C.social[s[0]])]).filter(s=>s[1]);
  $('#app').innerHTML='<div class="card center"><div class="av">'+img(av,'👤')+'</div><h3>'+esc(nm)+'</h3><p class="mu">'+esc(session.user.email||'')+'</p><div class="pill" style="display:inline-block;margin-top:10px">Wallet: ৳ '+fmt(profile?profile.wallet_balance||0:0)+'</div></div>'
  +'<div class="card"><h3>Account Settings</h3><button class="btn alt" data-act="rename">নাম পরিবর্তন করুন</button></div>'
  +'<div class="card"><h3>Support Contact</h3>'+(C.supportContact?'<p>'+esc(C.supportContact)+'</p>':'')+ct.map(s=>'<a class="btn alt" href="'+esc(s[1])+'" target="_blank" rel="noopener">'+s[0]+'</a>').join('')+((!C.supportContact&&!ct.length)?'<p class="mu">যোগাযোগের তথ্য এখনো যোগ করা হয়নি।</p>':'')+'</div>'
  +'<button class="btn" data-act="logout" style="background:#e5484d">Logout</button>';
 },
 tool(k){
  const T=TOOLS.find(t=>t.k===k);if(!T){location.hash='#/home';return}
  let h='<a class="back" href="#/home">← হোম</a><div class="card head"><span class="ic sm">'+T.i+'</span><h2>'+T.n+'</h2></div>';
  if(k==='root'){
   const ct=[['whatsapp','WhatsApp'],['telegram','Telegram']].map(s=>[s[1],link(s[0],C.social[s[0]])]).filter(s=>s[1]);
